# The list of clings exercises, in the order they are done.
# Each exercise lives at exercises/DIR/NAME.c, its solution at solutions/DIR/NAME.c.

format_version = 1

welcome_message = """
Is this your first time? Don't worry, clings is made for beginners!
We are going to teach you a lot of things about C, but before we can
get started, here are some notes about how clings operates:

1. The central concept behind clings is that you solve exercises. These
   exercises usually contain some compiler or logic errors which cause the
   exercise to fail compilation or testing. It's your job to find all errors
   and fix them!
2. Make sure to have CLion (or your editor) open on the `clings/` folder.
   The path of the current exercise is always shown under the progress bar,
   and you can click it to open the file.
3. If you're stuck on an exercise, enter `h` to show a hint.
4. When you have solved an exercise, compare your answer with the file
   under `solutions/` that clings points you to. There is often more than
   one good way to do it!
"""

final_message = """
We hope you enjoyed learning about C!
Remember that the `solutions/` folder holds a reference solution for every
exercise, so it's worth comparing them with your own once more.
If you change or add exercises, `clings dev check` verifies the exercise set.
"""

# INTRO

[[exercises]]
name = "intro1"
dir = "00_intro"
skip_check_unsolved = true
hint = """
Enter `n` to move on to the next exercise.
You might need to press ENTER after typing `n`."""

[[exercises]]
name = "intro2"
dir = "00_intro"
hint = """
Read the compiler message carefully: it names the header that is missing
and even suggests the line you need to add."""

# VARIABLES

[[exercises]]
name = "variables1"
dir = "01_variables"
hint = """
The compiler says `x` is undeclared. A declaration starts with the type
of the variable, followed by its name.
See K&R 1.2 and Beej 3.1."""

[[exercises]]
name = "variables2"
dir = "01_variables"
strict = true
hint = """
The compiler warns that `x` is used uninitialized. C does not give local
variables a starting value; you have to supply one.
See K&R 2.4."""

[[exercises]]
name = "variables3"
dir = "01_variables"
hint = """
The division itself produces 0.75. Look at the type of the variable the
result is stored in: what does it do with the part after the point?
See K&R 2.2 and 2.7."""

[[exercises]]
name = "variables4"
dir = "01_variables"
hint = """
A `const` variable can be given a value only once: in its declaration.
See K&R 2.4."""

[[exercises]]
name = "variables5"
dir = "01_variables"
hint = """
Double quotes make a string; single quotes make one character.
See K&R 2.3."""

# FUNCTIONS

[[exercises]]
name = "functions1"
dir = "02_functions"
hint = """
You can either move the definition above `main`, or add a declaration
(a prototype) above `main`: the first line of the definition, ending in `;`.
See K&R 1.7."""

[[exercises]]
name = "functions2"
dir = "02_functions"
hint = """
Read the compiler message and compare the call with the parameter list
of `ring`. How many times should it ring?
See K&R 1.7."""

[[exercises]]
name = "functions3"
dir = "02_functions"
strict = true
hint = """
Computing a value is not the same as giving it back to the caller.
Some languages return the last expression automatically; C does not.
See K&R 4.1."""

[[exercises]]
name = "functions4"
dir = "02_functions"
hint = """
`x` is a copy of `a`, not `a` itself. Instead of changing the copy, make
`increment` give back the new value, and store it in `a`.
See K&R 1.8."""

# IF

[[exercises]]
name = "if1"
dir = "03_if"
hint = """
Compare `a` with `b` in an `if`, and return one of them in each branch.
Remove the `(void)` lines once you use the parameters.
See K&R 3.2."""

[[exercises]]
name = "if2"
dir = "03_if"
strict = true
hint = """
One `=` and two `==` do very different things in C. Which one compares?
See K&R 3.2."""

[[exercises]]
name = "if3"
dir = "03_if"
strict = true
hint = """
An `if` without braces controls only the one statement right after it.
Which statements should run only for high scores?
See K&R 3.2 and Beej 3.3.1."""

# LOOPS

[[exercises]]
name = "loops1"
dir = "04_loops"
hint = """
Work out by hand which values `i` takes for `sum_to(1)`. Is `n` itself
ever added?
See K&R 1.3."""

[[exercises]]
name = "loops2"
dir = "04_loops"
hint = """
Each pass through the loop should remove one digit from `n`. Integer
division throws away the remainder: what is 123 / 10?
See K&R 3.5."""

[[exercises]]
name = "loops3"
dir = "04_loops"
hint = """
`do { ... } while (condition);` runs the body first and checks afterwards.
Note the semicolon after the closing parenthesis.
See K&R 3.6."""

[[exercises]]
name = "loops4"
dir = "04_loops"
hint = """
One keyword leaves a loop immediately; another skips to the next pass.
In the second function, test for a multiple of 3 with `%` first.
See K&R 3.7."""

# IO

[[exercises]]
name = "io1"
dir = "05_io"
stdin = "hello\nworld\n"
hint = """
`while ((c = getchar()) != EOF)` reads until the input ends. Declare `c`
as an `int` and keep a `long` counter. Newlines are characters too.
See K&R 1.5.1-1.5.2."""

[[exercises]]
name = "io2"
dir = "05_io"
stdin = "the quick brown fox\njumps over\n\nthe lazy dog\n"
hint = """
Each '\n' ends a line. Keep a flag saying whether you are inside a word:
a blank clears it, and a non-blank while it is clear starts a new word.
See K&R 1.5.4."""

[[exercises]]
name = "io3"
dir = "05_io"
strict = true
stdin = "3 4\n"
hint = """
`scanf` needs to know where `a` and `b` live, not what they hold.
Which operator gives the address of a variable?
See K&R 7.4 and Beej 9.4."""

# SWITCH

[[exercises]]
name = "switch1"
dir = "06_switch"
strict = true
hint = """
Each case needs a statement that leaves the switch once its work is done.
See K&R 3.4."""

[[exercises]]
name = "switch2"
dir = "06_switch"
hint = """
Write `case 'a':` and the other vowels one after another with no statements
in between, then one `return 1;`. `default:` handles everything else.
See K&R 3.4 and Beej 3.3.5."""

# TYPES

[[exercises]]
name = "types1"
dir = "07_types"
strict = true
hint = """
`sizeof` gives a `size_t`, and printf has its own length modifier for it.
For the second part, `sizeof(double)` is the size of one double.
See K&R 2.2 and Beej 14."""

[[exercises]]
name = "types2"
dir = "07_types"
hint = """
`int` is usually 32 bits, so INT_MAX is the end of the line for it.
C has a signed integer type that is guaranteed to be at least 64 bits wide.
See K&R 2.2 and Beej 14."""

[[exercises]]
name = "types3"
dir = "07_types"
hint = """
'a' through 'z' are consecutive codes, and so are 'A' through 'Z'.
The distance from a lowercase letter to 'a' is the same as from its
uppercase form to 'A'. Handle 'z' separately.
See K&R 2.7 and Beej 14."""

[[exercises]]
name = "types4"
dir = "07_types"
strict = true
hint = """
The loop has to reach -1 to stop, and an unsigned type cannot hold -1.
Which type can?
See K&R 2.2 and Beej 14."""

[[exercises]]
name = "types5"
dir = "07_types"
hint = """
If either operand of `/` is a double, the division keeps the fraction.
For `approx_equal`, look at how far apart `a` and `b` are, whichever is
larger: `fabs` from <math.h> gives the absolute value of a double.
See K&R 2.7 and Beej 15."""

# OPERATORS

[[exercises]]
name = "operators1"
dir = "08_operators"
hint = """
The position of `++` or `--` decides whether you get the value from before
or after the change.
See K&R 2.8 and Beej 3.2."""

[[exercises]]
name = "operators2"
dir = "08_operators"
strict = true
hint = """
Read each expression the way the compiler groups it: `/` before `+`, and
`==` before `&`. Parentheses make it group the way you mean.
See K&R 2.9 and 2.12, and Beej 3.2."""

[[exercises]]
name = "operators3"
dir = "08_operators"
hint = """
A `?:` can be nested inside another one: the false branch of the first
test can be a second test.
See K&R 2.11 and Beej 3.2."""

# QUIZ 1

[[exercises]]
name = "quiz1"
dir = "quizzes"
hint = """
Write each function with an `int` parameter list and an `int` return type,
above `main`. `%` gives the remainder, which tells you whether one number
divides another; the gcd needs a `while` loop.
See K&R 2.5, 3.5 and Beej 3.2."""

# ARRAYS

[[exercises]]
name = "arrays1"
dir = "09_arrays"
hint = """
An array declaration gives the element type, the name, and the number of
elements in square brackets. Indexes start at 0, so the last one is one
less than the size.
See K&R 1.6 and Beej 6."""

[[exercises]]
name = "arrays2"
dir = "09_arrays"
strict = true
hint = """
Inside the function, `values` is a pointer, so sizeof measures the pointer.
The caller already knows the length and hands it to you.
See K&R 5.7 and Beej 6."""

[[exercises]]
name = "arrays3"
dir = "09_arrays"
hint = """
How many times does the loop run, and what is the largest index it uses?
Compare that with the largest valid index of a 5-element array.
See K&R 1.6 and Beej 6."""

[[exercises]]
name = "arrays4"
dir = "09_arrays"
hint = """
`grid[row]` is itself an array of 4 ints, so `grid[row][c]` picks one of
them. For the whole grid, loop over the rows; `sum_all` may call `sum_row`.
See K&R 5.7 and Beej 6."""

# STRINGS

[[exercises]]
name = "strings1"
dir = "10_strings"
hint = """
Count the chars the array must hold, including the '\\0' at the end. You may
also leave the size out and let the compiler count from the initializer.
See K&R 1.9 and Beej 7."""

[[exercises]]
name = "strings2"
dir = "10_strings"
hint = """
Keep an index, starting at 0, and move it forward while `s[index]` is not
'\\0'. When the loop stops, the index is the length.
See K&R 1.9 and Beej 7."""

[[exercises]]
name = "strings3"
dir = "10_strings"
hint = """
Count the chars in "Hello, world!", then add one for the '\\0'. The array
must be at least that big.
See K&R 7.8.1 and Beej 7."""

[[exercises]]
name = "strings4"
dir = "10_strings"
strict = true
hint = """
Two strings with the same chars can live at different addresses. Look up
what `strcmp` returns when its arguments are equal.
See K&R 7.8.1 and Beej 7."""

[[exercises]]
name = "strings5"
dir = "10_strings"
hint = """
For `reverse`, find the length first, then swap s[i] with its mirror
position until you reach the middle. <ctype.h> has `toupper`.
See K&R 1.9 and Beej 21."""

# POINTERS

[[exercises]]
name = "pointers1"
dir = "11_pointers"
hint = """
An `int *` holds an address, and `x` is an int, not an address. Which
operator gives you the address of a variable?
See K&R 5.1 and Beej 5."""

[[exercises]]
name = "pointers2"
dir = "11_pointers"
hint = """
`*a` is the caller's first int. Keep a copy of it in a temporary variable
before you overwrite it, as you would swap two variables directly.
See K&R 5.2 and Beej 5."""

[[exercises]]
name = "pointers3"
dir = "11_pointers"
hint = """
A pointer can be compared with NULL like any other value. Decide what to
return before you use `*p`.
See K&R 5.4 and Beej 5."""

[[exercises]]
name = "pointers4"
dir = "11_pointers"
hint = """
Start a `const int *` at `begin` and add one to it each time round the
loop; stop when it equals `end`, without reading `*end`.
See K&R 5.3, 5.4 and Beej 11."""

[[exercises]]
name = "pointers5"
dir = "11_pointers"
hint = """
`*a` has type `const char *`: it is the caller's pointer variable. Swap the
two pointers, not the chars they point to.
See K&R 5.6 and Beej 23."""

# STRUCTS

[[exercises]]
name = "structs1"
dir = "12_structs"
hint = """
A field is declared inside the braces like a variable, with a type, a name
and a semicolon. The tests need two of them.
See K&R 6.1 and Beej 8."""

[[exercises]]
name = "structs2"
dir = "12_structs"
hint = """
`p` is a `struct Point *`, not a `struct Point`. C has an operator that
follows a pointer and picks a field in one step.
See K&R 6.4 and Beej 8."""

[[exercises]]
name = "structs3"
dir = "12_structs"
hint = """
To change the caller's struct, the function needs its address, and the
call must pass one. `make_point` can build a struct from x and y and
return it like any other value.
See K&R 6.2 and Beej 8."""

[[exercises]]
name = "structs4"
dir = "12_structs"
hint = """
Fields of a nested struct are reached with two dots, like
`r.top_left.x`. For the people, loop over the array as you would over ints.
See K&R 6.3 and Beej 8."""

# ENUMS AND TYPEDEF

[[exercises]]
name = "enums1"
dir = "13_enums_typedef"
strict = true
hint = """
Add the missing colour to the list of enumerators first. Then read the next
compiler message: it names the enumerator the switch does not handle.
See K&R 2.3 and Beej 22."""

[[exercises]]
name = "enums2"
dir = "13_enums_typedef"
hint = """
An enum value compares like an int, so the error codes are the ones from
400 up. An enumerator can be given a value with `=`, and the ones after it
count on from there.
See K&R 2.3 and Beej 22."""

[[exercises]]
name = "typedef1"
dir = "13_enums_typedef"
hint = """
Look at how `length` names the type of its parameter. The struct itself
has no name after the `struct` keyword.
See K&R 6.7 and Beej 10."""

# QUIZ 2

[[exercises]]
name = "quiz2"
dir = "quizzes"
hint = """
Write each function above `main` with the parameter list from the comment.
Divide as `double`s for the average, walk a string until its '\\0', and
for `trim_newline` look at the char just before the end.
See K&R 5.5, 6.3 and Beej 7."""
